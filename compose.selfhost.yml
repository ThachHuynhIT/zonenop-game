# Self-hosted behind the host's Traefik + Cloudflare Tunnel (no published ports), same as be_game.
#   docker compose -f compose.selfhost.yml up -d --build      → https://${WEB_DOMAIN}
# Deployed by .github/workflows/deploy.yml. .env next to this file: WEB_DOMAIN and
# NEXT_PUBLIC_TIENLEN_SERVER_URL (required), NEXT_PUBLIC_TIENLEN_FALLBACK_URL (optional backup be_game),
# NEXT_PUBLIC_SITE_URL (defaults to https://${WEB_DOMAIN}).
# NEXT_PUBLIC_* are baked in at build time: changing them needs `up -d --build`, not just a restart.
# be_game's ALLOWED_ORIGIN must include https://${WEB_DOMAIN}, or its WebSockets reject this site.
name: games_web
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_TIENLEN_SERVER_URL: ${NEXT_PUBLIC_TIENLEN_SERVER_URL:?set NEXT_PUBLIC_TIENLEN_SERVER_URL in .env}
        NEXT_PUBLIC_TIENLEN_FALLBACK_URL: ${NEXT_PUBLIC_TIENLEN_FALLBACK_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${WEB_DOMAIN}}
    image: games_web:local
    environment:
      # Commit being deployed (exported by .github/workflows/deploy.yml); /api/health reports it.
      BUILD_COMMIT: ${BUILD_COMMIT:-}
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.games_web.rule=Host(`${WEB_DOMAIN:?set WEB_DOMAIN in .env}`)"
      - "traefik.http.routers.games_web.entrypoints=web"
      - "traefik.http.services.games_web.loadbalancer.server.port=3000"
      - "traefik.http.services.games_web.loadbalancer.healthcheck.path=/robots.txt"
      - "traefik.http.services.games_web.loadbalancer.healthcheck.interval=30s"

networks:
  traefik_network:
    name: traefik_network
    external: true
