name: Dependency audit

# Kept out of the CI workflow on purpose: Deploy waits for CI, and a newly published advisory must not block a
# release overnight. Dependabot alerts are off on this repo (too much email), so this weekly run is the only
# automatic advisory check. A red run means: fix the dependency or add a reviewed entry to audit-exceptions.json.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm run audit:check
