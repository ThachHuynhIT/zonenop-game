# Local run of the production image (no Traefik):
#   docker compose up --build      → http://localhost:3000
# Reads NEXT_PUBLIC_TIENLEN_SERVER_URL from .env (be_game, e.g. http://localhost:4000).
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_TIENLEN_SERVER_URL: ${NEXT_PUBLIC_TIENLEN_SERVER_URL:-http://localhost:4000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: games_web:local
    init: true
    ports:
      - "3000:3000"
